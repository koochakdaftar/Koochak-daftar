<style>

    font-size:11px;
    letter-spacing:4px;
}

    margin-top:20px;
    font-size:42px;

    color:#383c2d;
}

    <article class="paper">

        <a class="back" href="index.html">

        </div>

            اولین صفحه
        </h1>

            ایهام صمدی
        </div>

        <div class="line"></div>

        <div class="poem">
اینجا اولین صفحه‌ی دفتر است؛

جایی برای حرف‌هایی
که شاید هیچ‌وقت گفته نشدند.

برای کلماتی که ماندند،
برای سکوت‌هایی که طول کشیدند،
و برای احساسی
که هنوز تمام نشده...

این فقط اولین صفحه است؛
دفتر ادامه دارد.
