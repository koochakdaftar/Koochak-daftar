<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کوچک دفتر | ایهام صمدی</title>
<meta name="description" content="کوچک دفتر؛ دفتر شعر و نوشته‌های ایهام صمدی، جلال ضمدی">
<meta name="author" content="ایهام صمدی - جلال ضمدی">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:#000;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
    overflow:hidden;
}

/* =========================
   CINEMATIC INTRO
========================= */

.intro{
    position:fixed;
    inset:0;
    width:100%;
    height:100vh;
    height:100svh;
    overflow:hidden;
    background:
        radial-gradient(
            ellipse at center,
            #11111b 0%,
            #05050a 42%,
            #000 100%
        );
}

/* نور عظیم پشت صحنه */

.ambient{
    position:absolute;
    width:75vw;
    height:75vw;
    max-width:700px;
    max-height:700px;
    left:50%;
    top:42%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(130,120,190,.12),
        rgba(80,70,130,.05) 35%,
        transparent 70%
    );
    filter:blur(25px);
    animation:ambient 8s ease-in-out infinite;
}

@keyframes ambient{
    0%,100%{
        opacity:.45;
        transform:translate(-50%,-50%) scale(.9);
    }
    50%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.15);
    }
}

/* =========================
   STARS
========================= */

.stars{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff;
    opacity:0;
    animation:starAppear var(--time) ease-in-out infinite;
    animation-delay:var(--delay);
}

@keyframes starAppear{
    0%,100%{
        opacity:0;
        transform:scale(.3);
    }
    50%{
        opacity:var(--opacity);
        transform:scale(1);
    }
}

/* =========================
   MOON
========================= */

.moon-wrap{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-58%);
    width:190px;
    height:190px;
    opacity:0;
    animation:moonReveal 3s ease forwards;
    animation-delay:1.2s;
}

.moon{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:
        radial-gradient(
            circle at 32% 28%,
            #fff 0%,
            #f4f3fa 35%,
            #d4d2df 70%,
            #a9a6b4 100%
        );
    box-shadow:
        0 0 20px rgba(255,255,255,.45),
        0 0 60px rgba(210,205,255,.25),
        0 0 150px rgba(120,110,190,.15);
}

/* لکه های ماه */

.moon::before,
.moon::after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:rgba(120,115,130,.10);
}

.moon::before{
    width:35px;
    height:35px;
    top:32px;
    left:42px;
    box-shadow:
        48px 30px 0 rgba(120,115,130,.08),
        20px 82px 0 rgba(120,115,130,.09),
        83px 78px 0 rgba(120,115,130,.07);
}

.moon::after{
    width:22px;
    height:22px;
    top:105px;
    left:52px;
    box-shadow:
        54px -70px 0 rgba(120,115,130,.07),
        70px 32px 0 rgba(120,115,130,.06);
}

/* هاله ماه */

.moon-glow{
    position:absolute;
    inset:-70px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(210,205,255,.12),
        transparent 68%
    );
    filter:blur(12px);
    animation:moonGlow 5s ease-in-out infinite;
}

@keyframes moonGlow{
    0%,100%{
        opacity:.4;
        transform:scale(.9);
    }
    50%{
        opacity:1;
        transform:scale(1.12);
    }
}

@keyframes moonReveal{
    0%{
        opacity:0;
        transform:translate(-50%,-58%) scale(.15);
        filter:blur(25px);
    }
    60%{
        opacity:1;
        filter:blur(0);
    }
    100%{
        opacity:1;
        transform:translate(-50%,-58%) scale(1);
    }
}

/* =========================
   SHOOTING STARS
========================= */

.shooting-star{
    position:absolute;
    width:130px;
    height:1px;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.8),
        transparent
    );
    opacity:0;
    transform:rotate(-28deg);
    animation:shoot 7s linear infinite;
}

.shooting-star.one{
    top:22%;
    left:-20%;
    animation-delay:4s;
}

.shooting-star.two{
    top:35%;
    left:-25%;
    animation-delay:8s;
    width:90px;
}

@keyframes shoot{
    0%{
        opacity:0;
        transform:translate(0,0) rotate(-28deg);
    }
    5%{
        opacity:1;
    }
    18%{
        opacity:0;
        transform:translate(150vw,55vh) rotate(-28deg);
    }
    100%{
        opacity:0;
    }
}

/* =========================
   TEXT
========================= */

.content{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,85%);
    width:100%;
    text-align:center;
    opacity:0;
    animation:textReveal 2.5s ease forwards;
    animation-delay:3.5s;
}

@keyframes textReveal{
    from{
        opacity:0;
        transform:translate(-50%,100%);
    }
    to{
        opacity:1;
        transform:translate(-50%,85%);
    }
}

.subtitle{
    font-size:10px;
    letter-spacing:8px;
    color:#77727f;
    margin-bottom:18px;
}

.title{
    font-size:clamp(48px,13vw,100px);
    font-weight:300;
    letter-spacing:7px;
    text-shadow:
        0 0 35px rgba(255,255,255,.08);
}

.pen{
    margin-top:20px;
    font-size:18px;
    letter-spacing:5px;
    color:#aaa6b2;
}

.real{
    margin-top:9px;
    color:#55515d;
    font-size:12px;
    letter-spacing:2px;
}

/* =========================
   QUOTE
========================= */

.quote{
    position:absolute;
    left:50%;
    bottom:14%;
    transform:translateX(-50%);
    width:90%;
    max-width:650px;
    text-align:center;
    color:#6d6875;
    font-size:13px;
    line-height:2.2;
    opacity:0;
    animation:quoteReveal 2s ease forwards;
    animation-delay:5.3s;
}

@keyframes quoteReveal{
    from{
        opacity:0;
        transform:translate(-50%,15px);
    }
    to{
        opacity:1;
        transform:translate(-50%,0);
    }
}

/* =========================
   ENTER BUTTON
========================= */

.enter{
    position:absolute;
    left:50%;
    bottom:6%;
    transform:translateX(-50%);
    padding:13px 34px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:50px;
    color:#ddd;
    background:rgba(255,255,255,.025);
    backdrop-filter:blur(10px);
    text-decoration:none;
    font-size:13px;
    opacity:0;
    animation:buttonReveal 2s ease forwards;
    animation-delay:6.2s;
    transition:.5s;
}

.enter:hover{
    color:#000;
    background:#fff;
    box-shadow:0 0 40px rgba(255,255,255,.15);
    transform:translateX(-50%) translateY(-4px);
}

@keyframes buttonReveal{
    from{
        opacity:0;
        transform:translateX(-50%) translateY(15px);
    }
    to{
        opacity:1;
        transform:translateX(-50%) translateY(0);
    }
}

/* =========================
   PAGE EXIT
========================= */

.exit{
    position:fixed;
    inset:0;
    z-index:100;
    background:#000;
    pointer-events:none;
    opacity:0;
    transition:1.4s ease;
}

body.leaving .exit{
    opacity:1;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .moon-wrap{
        width:125px;
        height:125px;
        transform:translate(-50%,-70%);
    }

    @keyframes moonReveal{
        0%{
            opacity:0;
            transform:translate(-50%,-70%) scale(.15);
            filter:blur(25px);
        }
        60%{
            opacity:1;
            filter:blur(0);
        }
        100%{
            opacity:1;
            transform:translate(-50%,-70%) scale(1);
        }
    }

    .content{
        transform:translate(-50%,35%);
    }

    @keyframes textReveal{
        from{
            opacity:0;
            transform:translate(-50%,50%);
        }
        to{
            opacity:1;
            transform:translate(-50%,35%);
        }
    }

    .title{
        font-size:50px;
        letter-spacing:4px;
    }

    .pen{
        font-size:16px;
    }

    .quote{
        bottom:18%;
        font-size:12px;
    }

    .enter{
        bottom:7%;
    }
}
</style>
</head>

<body>

<div class="intro">

    <div class="ambient"></div>

    <div class="stars">

        <span class="star" style="left:8%;top:18%;--time:5s;--delay:1s;--opacity:.8"></span>
        <span class="star" style="left:17%;top:42%;--time:7s;--delay:2s;--opacity:.5"></span>
        <span class="star" style="left:28%;top:16%;--time:6s;--delay:3s;--opacity:.7"></span>
        <span class="star" style="left:39%;top:28%;--time:8s;--delay:1s;--opacity:.6"></span>
        <span class="star" style="left:52%;top:12%;--time:5s;--delay:4s;--opacity:.8"></span>
        <span class="star" style="left:65%;top:25%;--time:7s;--delay:2s;--opacity:.6"></span>
        <span class="star" style="left:78%;top:16%;--time:6s;--delay:3s;--opacity:.7"></span>
        <span class="star" style="left:91%;top:34%;--time:8s;--delay:1s;--opacity:.5"></span>

        <span class="star" style="left:12%;top:70%;--time:7s;--delay:4s;--opacity:.6"></span>
        <span class="star" style="left:25%;top:82%;--time:6s;--delay:2s;--opacity:.8"></span>
        <span class="star" style="left:45%;top:72%;--time:8s;--delay:1s;--opacity:.5"></span>
        <span class="star" style="left:70%;top:78%;--time:5s;--delay:3s;--opacity:.7"></span>
        <span class="star" style="left:88%;top:68%;--time:7s;--delay:2s;--opacity:.6"></span>

    </div>

    <div class="shooting-star one"></div>
    <div class="shooting-star two"></div>

    <div class="moon-wrap">
        <div class="moon-glow"></div>
        <div class="moon"></div>
    </div>

    <div class="content">

        <div class="subtitle">
            A SMALL NOTEBOOK
        </div>

        <h1 class="title">
            کوچک دفتر
        </h1>

        <div class="pen">
            ایهام صمدی
        </div>

        <div class="real">
            جلال ضمدی
        </div>

    </div>

    <div class="quote">
        «هر آنچه نتوانستم بگویم،
        اینجا نوشتم...»
    </div>

    <a href="#inside" class="enter" onclick="enterSite(event)">
        ورود به کوچک دفتر
    </a>

</div>

<div class="exit"></div>

<script>

function enterSite(event){

    event.preventDefault();

    document.body.classList.add("leaving");

    setTimeout(function(){

        window.location.href = "#inside";

    },1200);

}

</script>

</body>
</html>
