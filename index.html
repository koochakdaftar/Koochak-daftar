<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>کوچک دفتر | ایهام صمدی</title>

<meta name="description" content="کوچک دفتر؛ دفتر شعر و نوشته‌های ایهام صمدی، جلال ضمدی">
<meta name="keywords" content="کوچک دفتر, ایهام صمدی, جلال ضمدی, شعر, اشعار, نوشته">

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500&family=Playfair+Display:wght@400&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#020207;
    color:#f4f1eb;
    font-family:'Vazirmatn',Tahoma,sans-serif;
    overflow-x:hidden;
}

/* =========================
   BACKGROUND
========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-10;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(110,100,170,.16),
            transparent 30%
        ),
        radial-gradient(
            circle at 10% 80%,
            rgba(80,90,150,.08),
            transparent 30%
        ),
        linear-gradient(
            180deg,
            #03030a 0%,
            #06050d 50%,
            #020207 100%
        );
}

/* ستاره‌ها */

.stars,
.stars2,
.stars3{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-5;
}

.stars{
    background-image:
        radial-gradient(1px 1px at 10% 20%,white,transparent),
        radial-gradient(1px 1px at 20% 80%,white,transparent),
        radial-gradient(1px 1px at 35% 30%,white,transparent),
        radial-gradient(1px 1px at 48% 75%,white,transparent),
        radial-gradient(1px 1px at 63% 18%,white,transparent),
        radial-gradient(1px 1px at 76% 60%,white,transparent),
        radial-gradient(1px 1px at 90% 25%,white,transparent),
        radial-gradient(1px 1px at 95% 85%,white,transparent);
    opacity:.55;
    animation:starsMove 12s linear infinite;
}

.stars2{
    background-image:
        radial-gradient(1px 1px at 15% 55%,white,transparent),
        radial-gradient(1px 1px at 30% 10%,white,transparent),
        radial-gradient(1px 1px at 52% 45%,white,transparent),
        radial-gradient(1px 1px at 68% 88%,white,transparent),
        radial-gradient(1px 1px at 82% 35%,white,transparent);
    opacity:.35;
    animation:starsMove 20s linear infinite reverse;
}

.stars3{
    background-image:
        radial-gradient(2px 2px at 25% 40%,white,transparent),
        radial-gradient(2px 2px at 72% 25%,white,transparent),
        radial-gradient(2px 2px at 85% 75%,white,transparent);
    opacity:.2;
    animation:twinkle 4s ease-in-out infinite;
}

@keyframes starsMove{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-25px);
    }
}

@keyframes twinkle{
    0%,100%{opacity:.15}
    50%{opacity:.45}
}
